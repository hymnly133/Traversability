[project]
name = "mujoco-traversability-demo"
version = "0.1.0"
description = "A MuJoCo demo for quantifying path traversability with geometric clearance metrics."
requires-python = ">=3.10,<3.13"
dependencies = [
  "matplotlib>=3.10",
  "mujoco>=3.9",
  "numpy>=2.2",
  "rich>=15.0",
]

[project.scripts]
traversability-demo = "traversability.evaluate:main"
multilevel-terrain-demo = "traversability.multilevel_demo:main"
verify-multilevel-reproduction = "traversability.verify_reproduction:main"
realtime-terrain-demo = "traversability.realtime_demo:main"
verify-implicit-map = "traversability.verify_implicit_map:main"
planner-ablation-demo = "traversability.ablation_demo:main"
tracking-demo = "traversability.tracking_demo:main"
pointcloud-demo = "traversability.pointcloud_demo:main"
benchmark-suite = "traversability.benchmark_suite:main"
verify-pointcloud-io = "traversability.verify_pointcloud_io:main"
verify-ros-wrapper = "traversability.verify_ros_wrapper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traversability"]
